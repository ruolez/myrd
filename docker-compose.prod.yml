# Production overlay for one dedicated server, managed by install.sh:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# (install.sh sets COMPOSE_FILE in .env, so a plain `docker compose` works in /opt/myrd.)
# .env from install.sh: PUBLIC_URL, SITE_ADDRESS, CADDY_TLS, TURN_URLS, TURN_URLS_AGENT,
# TURN_EXTERNAL_IP, PG_SHARED_BUFFERS, PG_EFFECTIVE_CACHE_SIZE.
# TLS: certbot (host) → deploy hook copies the certificate to ./data/tls → Caddy + coturn.
services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./data/acme:/acme:ro
      - ./data/tls:/tls:ro

  # coturn needs the whole relay port range; host networking avoids publishing
  # thousands of UDP ports through docker-proxy.
  coturn:
    network_mode: host
    ports: !reset []
    environment:
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49152}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-65535}
      TURN_ALLOW_PRIVATE_PEERS: "false"
      TURN_TLS_CERT: /tls/fullchain.pem
      TURN_TLS_KEY: /tls/privkey.pem
    volumes:
      - ./deploy/coturn/entrypoint.sh:/etc/coturn/entrypoint.sh:ro
      - ./data/tls:/tls:ro
